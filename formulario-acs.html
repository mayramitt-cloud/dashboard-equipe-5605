<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Casos - Equipe 5605</title>
    <!-- Firebase Scripts (CDN Compatible) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(139, 92, 246, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #8B5CF6;
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 13px;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #8B5CF6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .form-row.full {
            grid-column: 1 / -1;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
            color: white;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(139, 92, 246, 0.3);
        }
        
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-reset {
            background: #F3F4F6;
            color: #666;
        }
        
        .btn-reset:hover {
            background: #E5E7EB;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            animation: slideIn 0.3s ease-out;
        }
        
        .alert.success {
            background: #D1FAE5;
            color: #065F46;
            border: 1px solid #6EE7B7;
            display: block;
        }
        
        .alert.error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
            display: block;
        }
        
        .alert.loading {
            background: #DBEAFE;
            color: #1E40AF;
            border: 1px solid #93C5FD;
            display: block;
        }
        
        .status {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 15px;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Novo Caso</h1>
            <p>Equipe 5605 - UBS Alto do Umuarama</p>
        </div>
        
        <div id="alert" class="alert"></div>
        
        <form id="caseForm">
            <div class="form-group">
                <label>Quem traz o caso? (Seu nome) *</label>
                <input type="text" name="quem_traz" required placeholder="Seu nome completo">
            </div>
            
            <div class="form-group">
                <label>Nome do paciente *</label>
                <input type="text" name="nome_paciente" required placeholder="Nome completo do paciente">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Nº da família *</label>
                    <input type="text" name="numero_familia" required placeholder="Ex: 0001">
                </div>
                <div class="form-group">
                    <label>CPF/SUS</label>
                    <input type="text" name="cpf_sus" placeholder="Deixar em branco se não souber">
                </div>
            </div>
            
            <div class="form-group">
                <label>Data de Nascimento *</label>
                <input type="date" name="data_nascimento" required>
            </div>
            
            <div class="form-group">
                <label>ACS Responsável *</label>
                <select name="acs_responsavel" required>
                    <option value="">-- Selecione a ACS --</option>
                    <option value="Talyta (Micro 1)">Talyta (Micro 1)</option>
                    <option value="Tatiana (Micro 2)">Tatiana (Micro 2)</option>
                    <option value="Adriene (Micro 3)">Adriene (Micro 3)</option>
                    <option value="Andreia (Micro 4)">Andreia (Micro 4)</option>
                    <option value="Rebeca (Micro 5)">Rebeca (Micro 5)</option>
                </select>
            </div>
            
            <div class="form-group form-row full">
                <label>Descrição do caso *</label>
                <textarea name="descricao_caso" required placeholder="Descreva brevemente o caso, queixa principal e o que foi feito..."></textarea>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-submit" id="btnSubmit">✓ Enviar caso</button>
                <button type="reset" class="btn-reset">↻ Limpar</button>
            </div>
            
            <div class="status" id="status"></div>
        </form>
    </div>
    
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCvLYYNWrHpyTxHMKw34Oxf74dKutb8klM",
            authDomain: "dashboard-equipe-5605.firebaseapp.com",
            projectId: "dashboard-equipe-5605",
            storageBucket: "dashboard-equipe-5605.firebasestorage.app",
            messagingSenderId: "103365730281",
            appId: "1:103365730281:web:6c4acbc88b3c81eb88f578"
        };
        
        let db, firebaseReady = false;
        
        // Inicializar Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            firebaseReady = true;
            console.log("✅ Firebase inicializado!");
        } catch (e) {
            console.warn("⚠️ Firebase falhou:", e.message);
        }
        
        // Funções auxiliares
        function showAlert(message, type = 'info') {
            const alertEl = document.getElementById('alert');
            alertEl.textContent = message;
            alertEl.className = `alert ${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    alertEl.className = 'alert';
                }, 5000);
            }
        }
        
        function setButtonState(loading) {
            const btn = document.getElementById('btnSubmit');
            btn.disabled = loading;
            btn.textContent = loading ? '⏳ Enviando...' : '✓ Enviar caso';
        }
        
        // Submeter formulário
        document.getElementById('caseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!firebaseReady) {
                showAlert('❌ Firebase não está pronto. Tente novamente em alguns segundos.', 'error');
                return;
            }
            
            setButtonState(true);
            showAlert('⏳ Enviando caso...', 'loading');
            
            try {
                const formData = new FormData(e.target);
                const caso = {
                    quem_traz: formData.get('quem_traz'),
                    nome_paciente: formData.get('nome_paciente'),
                    numero_familia: formData.get('numero_familia'),
                    cpf_sus: formData.get('cpf_sus') || 'N/A',
                    data_nascimento: formData.get('data_nascimento'),
                    acs_responsavel: formData.get('acs_responsavel'),
                    descricao_caso: formData.get('descricao_caso'),
                    status: 'novo',
                    urgente: false,
                    timestamp: new Date().toISOString(),
                    data_entrada: new Date().toLocaleDateString('pt-BR')
                };
                
                // Salvar no Firebase
                await db.collection('casos').add(caso);
                
                showAlert('✅ Caso enviado com sucesso! Aparecerá no painel em segundos.', 'success');
                document.getElementById('caseForm').reset();
                setButtonState(false);
                
                // Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
            } catch (error) {
                console.error('Erro ao enviar:', error);
                showAlert(`❌ Erro ao enviar: ${error.message}`, 'error');
                setButtonState(false);
            }
        });
    </script>
</body>
</html>
